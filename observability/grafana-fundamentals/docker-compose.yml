services:
  grafana:
    image: grafana/grafana:11.6
    container_name: grafana
    # environment:
    #   - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    #   - GF_AUTH_ANONYMOUS_ENABLED=true
    #   - GF_AUTH_BASIC_ENABLED=false
    ports:
      - "3000:3000/tcp"
    restart: unless-stopped
    volumes:
      - grafana_storage:/var/lib/grafana

volumes:
  grafana_storage: { }
